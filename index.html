<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI:哀</title>
<style>
html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1280px; height: 720px; background: #1B1A1C; }
#bg, #cv { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
#bg { object-fit: cover; opacity: 0; transition: opacity .3s; }
</style></head>
<body>
<div id="stage">
  <video id="bg" muted playsinline webkit-playsinline preload="auto"></video>
  <canvas id="cv" width="1280" height="720"></canvas>
</div>
<script src="game.js"></script>
</body></html>
